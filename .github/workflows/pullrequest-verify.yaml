name: Verifies PR are ready for merge

on:
  pull_request:
    branches:
      - main

jobs:
  verify-devcontainer:
    uses: project-origin/.github/.github/workflows/reusable-verify-devcontainer.yaml@398567dc7c6c9e6cdfcb78725858580a9e8c1538

  verify-code:
    uses: project-origin/.github/.github/workflows/reusable-verify-code.yaml@398567dc7c6c9e6cdfcb78725858580a9e8c1538

  verify-renovate-config:
    uses: project-origin/.github/.github/workflows/reusable-verify-renovate.yaml@398567dc7c6c9e6cdfcb78725858580a9e8c1538

  verify-chart:
    uses: project-origin/.github/.github/workflows/reusable-verify-chart.yaml@398567dc7c6c9e6cdfcb78725858580a9e8c1538

  verify-container-build:
    uses: project-origin/.github/.github/workflows/reusable-build-push-container-ghcr.yaml@398567dc7c6c9e6cdfcb78725858580a9e8c1538
    with:
      imagename: ghcr.io/project-origin/vault
      version: test
      context: .
      dockerfile: ./Vault.Dockerfile
      push: false
